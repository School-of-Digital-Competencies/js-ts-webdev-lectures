<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Примеры работы с формами</title>
    <!-- Bulma CSS framework for styling -->
    <link
      rel="stylesheet"
      href="https://fastly.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
    />
    <style>
      /* Hide all tab content by default */
      .tab-content {
        display: none;
      }
      /* Show only active tab content */
      .tab-content.is-active {
        display: block;
      }
      /* Add spacing below tabs */
      .tabs {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="title">Примеры работы с формами</h1>

      <!-- Tab navigation -->
      <div class="tabs">
        <ul>
          <li class="is-active" data-tab="basic-form">
            <a>Базовая форма</a>
          </li>
          <li data-tab="validation-form">
            <a>Валидация формы</a>
          </li>
          <li data-tab="dynamic-form">
            <a>Динамическая форма</a>
          </li>
        </ul>
      </div>

      <!-- Basic Form Tab -->
      <div id="basic-form" class="tab-content is-active">
        <div class="box">
          <h2 class="subtitle">Базовая форма</h2>
          <form id="basicForm">
            <!-- Name input field -->
            <div class="field">
              <label class="label">Имя</label>
              <div class="control">
                <input class="input" type="number" min="4" max="6" name="name" required />
              </div>
            </div>
            <!-- Email input field -->
            <div class="field">
              <label class="label">Email</label>
              <div class="control">
                <input class="input" type="email" name="email" required />
              </div>
            </div>
            <!-- Age dropdown selection -->
            <div class="field">
              <label class="label">Возраст</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="age" required>
                    <option value="">Выберите возраст</option>
                    <option value="18-25">18-25 лет</option>
                    <option value="26-35">26-35 лет</option>
                    <option value="36-45">36-45 лет</option>
                    <option value="46+">46+ лет</option>
                  </select>
                </div>
              </div>
            </div>
            <!-- Favorite color radio buttons -->
            <div class="field">
              <label class="label">Любимый цвет</label>
              <div class="control">
                <label class="radio">
                  <input
                    type="radio"
                    name="favoriteColor"
                    value="red"
                    required
                  />
                  Красный
                </label>
              </div>
              <div class="control">
                <label class="radio">
                  <input type="radio" name="favoriteColor" value="green" />
                  Зеленый
                </label>
              </div>
              <div class="control">
                <label class="radio">
                  <input type="radio" name="favoriteColor" value="blue" />
                  Синий
                </label>
              </div>
            </div>
            <!-- Interests checkboxes -->
            <div class="field">
              <label class="label">Интересы</label>
              <div class="control">
                <label class="checkbox">
                  <input type="checkbox" name="interests" value="programming" />
                  Программирование
                </label>
              </div>
              <div class="control">
                <label class="checkbox">
                  <input type="checkbox" name="interests" value="design" />
                  Дизайн
                </label>
              </div>
              <div class="control">
                <label class="checkbox">
                  <input type="checkbox" name="interests" value="marketing" />
                  Маркетинг
                </label>
              </div>
            </div>
            <!-- Submit button -->
            <div class="field">
              <div class="control">
                <button class="button is-primary" type="submit">
                  Отправить
                </button>
              </div>
            </div>
          </form>
          <!-- Result display area -->
          <div id="basicFormResult" class="mt-4"></div>
        </div>
      </div>

      <!-- Form Validation Tab -->
      <div id="validation-form" class="tab-content">
        <div class="box">
          <h2 class="subtitle">Валидация формы</h2>
          <form id="validationForm">
            <!-- Password input with validation -->
            <div class="field">
              <label class="label">Пароль</label>
              <div class="control">
                <input
                  class="input"
                  type="password"
                  name="password"
                  id="password"
                  required
                />
              </div>
              <p class="help">Минимум 8 символов, включая цифры и буквы</p>
            </div>
            <!-- Password confirmation -->
            <div class="field">
              <label class="label">Подтверждение пароля</label>
              <div class="control">
                <input
                  class="input"
                  type="password"
                  name="confirmPassword"
                  id="confirmPassword"
                  required
                />
              </div>
            </div>
            <!-- Validation button -->
            <div class="field">
              <div class="control">
                <button class="button is-primary" type="submit">
                  Проверить
                </button>
              </div>
            </div>
          </form>
          <!-- Validation result display area -->
          <div id="validationResult" class="mt-4"></div>
        </div>
      </div>

      <!-- Dynamic Form Tab -->
      <div id="dynamic-form" class="tab-content">
        <div class="box">
          <h2 class="subtitle">Динамическая форма</h2>

          <!-- Controls for adding dynamic inputs -->
          <div class="box">
            <div class="field">
              <label class="label">Add Dynamic Inputs</label>
              <div class="control">
                <button id="addTextInput" class="button is-primary">
                  Add Text Input
                </button>
                <button id="addCheckbox" class="button is-info">
                  Add Checkbox
                </button>
                <button id="showDynamicValues" class="button is-success">
                  Show Values
                </button>
              </div>
            </div>
          </div>

          <!-- Dynamic form container -->
          <form id="dynamicForm">
            <div class="field">
              <div class="control">
                <button type="submit" class="button is-primary">
                  Отправить форму
                </button>
              </div>
            </div>
          </form>

          <!-- Dynamic form values output -->
          <div id="dynamicOutput" class="box is-hidden">
            <h2 class="subtitle">Dynamic Input Values:</h2>
            <pre id="dynamicValuesOutput"></pre>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript files -->
    <script src="./src/tabs.js"></script>
    <script src="./src/basic-form.js"></script>
    <script src="./src/validation-form.js"></script>
    <script src="./src/dynamic-form.js"></script>
  </body>
</html>
